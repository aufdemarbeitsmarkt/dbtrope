models:
  - name: render_wav
    description: >
      Writes each piece in mixed_samples to <output_dir>/<piece_id>.wav as
      16-bit PCM, and records what it wrote. One row per piece.
    config:
      sample_rate: "{{ var('sample_rate') }}"
      output_dir: "{{ var('output_dir') }}"
    columns:
      - name: piece_id
        data_tests: [unique, not_null]
      - name: wav_path
        description: Path of the WAV file, relative to the project root.
        data_tests: [not_null]
      - name: channel_count
        data_tests: [not_null]
      - name: sample_rate
        data_tests: [not_null]
      - name: sample_count
        data_tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: "> 0"
      - name: duration_seconds
        data_tests: [not_null]
