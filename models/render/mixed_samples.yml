models:
  - name: mixed_samples
    description: >
      The mixed signal. One row per piece_id and sample_index, at the
      sample_rate var, from the first sample to the end of the last note.
      Every note in a piece is summed, then the piece is normalised so its
      loudest sample is 0.89.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [piece_id, sample_index]
    columns:
      - name: piece_id
        data_tests: [not_null]
      - name: sample_index
        description: Position in the piece; divide by sample_rate for seconds.
        data_tests: [not_null]
      - name: amplitude
        description: Signal level between -1 and 1.
        data_tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: "between -1 and 1"
