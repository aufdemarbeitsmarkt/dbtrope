models:
  - name: lullaby
    description: >
      Eight bars of 3/4 in D dorian, written in scale degrees and Roman
      numerals: a bell melody over a soft pad and a bass line.
    config:
      meta:
        tempo: 96
        meter: 3/4
        key: {root: D, scale: dorian}
        instruments:
          # a stored instrument with two settings changed for this piece
          soft:
            use: soft_pad
            pan: -0.3
            adsr: {r: 0.8}
          # an instrument defined only for this piece
          bell:
            partials: [[1, 0.6], [2.76, 0.3], [5.4, 0.1]]
            adsr: {a: 0.005, d: 0.4, s: 0, r: 0.8}
            pan: 0.3
        voices:
          - name: melody
            instrument: bell
            octave: 4
            degrees: [5, 4, 3, 2, 1, 2, 3, 4, 5, 6, 6, 5, 4, 3, 2, 1]
            beats: [h, q, q, q, q, h, q, dotted_h, h, q, q, q, q, h, q, dotted_h]
          - name: chords
            instrument: soft
            velocity: 70
            octave: 3
            chords: [i, i, v, IV, i, IV, v7, i]
            beats: [dotted_h]
          - name: bass
            # a stored instrument used as-is, without declaring it
            instrument: warm_bass
            velocity: 85
            octave: 2
            degrees: [1, 1, 5, 4, 1, 4, 5, 1]
            beats: [dotted_h]
