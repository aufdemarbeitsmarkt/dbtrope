models:
  - name: int_events__timed
    description: >
      Each note, chord or rest placed in the piece, one row per piece_id,
      voice_id and event_index. Sections play in the order of the form, and
      a voice's events in a section follow one another without gaps.
      event_index numbers a voice's events through the whole piece; a voice
      with the same name in several sections is one voice. Beats convert to
      seconds at the piece's tempo.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [piece_id, voice_id, event_index]
    columns:
      - name: piece_id
        data_tests: [not_null]
      - name: voice_id
        data_tests: [not_null]
      - name: event_index
        description: The event's position in its voice across the whole piece, from 1.
        data_tests: [not_null]
      - name: form_index
        description: The form entry the event plays in.
        data_tests: [not_null]
      - name: section_name
        data_tests: [not_null]
      - name: repetition_index
        description: Which time through its voice's events in the section this is, from 1.
        data_tests: [not_null]
      - name: written_event_index
        description: The event's position in the voice's pitch list as written, from 1.
        data_tests: [not_null]
      - name: velocity
        data_tests: [not_null]
      - name: start_beats
        description: Beats from the start of the piece.
        data_tests: [not_null]
      - name: duration_beats
        data_tests: [not_null]
      - name: start_seconds
        data_tests: [not_null]
      - name: duration_seconds
        data_tests: [not_null]

unit_tests:
  - name: events_are_placed_in_their_sections_at_the_piece_tempo
    model: int_events__timed
    given:
      - input: ref('int_events__sequenced')
        rows:
          - {piece_id: p, section_name: a, voice_id: lead, repetition_index: 1, event_index: 1, start_beats: 0, duration_beats: 1}
          - {piece_id: p, section_name: a, voice_id: lead, repetition_index: 1, event_index: 2, start_beats: 1, duration_beats: 3}
          - {piece_id: p, section_name: b, voice_id: lead, repetition_index: 1, event_index: 1, start_beats: 0, duration_beats: 2}
      - input: ref('int_sections__timed')
        rows:
          - {piece_id: p, form_index: 1, section_name: a, start_beats: 0}
          - {piece_id: p, form_index: 2, section_name: b, start_beats: 4}
          - {piece_id: p, form_index: 3, section_name: a, start_beats: 6}
      - input: ref('pieces')
        rows:
          - {piece_id: p, tempo_bpm: 120}
    expect:
      rows:
        - {event_index: 1, form_index: 1, written_event_index: 1, start_beats: 0, duration_beats: 1, start_seconds: 0, duration_seconds: 0.5}
        - {event_index: 2, form_index: 1, written_event_index: 2, start_beats: 1, duration_beats: 3, start_seconds: 0.5, duration_seconds: 1.5}
        - {event_index: 3, form_index: 2, written_event_index: 1, start_beats: 4, duration_beats: 2, start_seconds: 2, duration_seconds: 1}
        - {event_index: 4, form_index: 3, written_event_index: 1, start_beats: 6, duration_beats: 1, start_seconds: 3, duration_seconds: 0.5}
        - {event_index: 5, form_index: 3, written_event_index: 2, start_beats: 7, duration_beats: 3, start_seconds: 3.5, duration_seconds: 1.5}
