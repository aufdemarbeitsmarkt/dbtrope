models:
  - name: int_score__note_events
    description: >
      The score. One row per sounding note, keyed by piece_id, voice_id and
      event_index, with its pitch and its start and length in seconds.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [piece_id, voice_id, event_index]
    columns:
      - name: piece_id
        data_tests: [not_null]
      - name: voice_id
        data_tests: [not_null]
      - name: event_index
        data_tests: [not_null]
      - name: midi_note
        description: MIDI note number; 60 is middle C.
        data_tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: "between 0 and 127"
      - name: frequency_hz
        description: Equal-tempered frequency, with A4 (MIDI 69) at 440 Hz.
        data_tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: "> 0"
      - name: start_seconds
        data_tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: ">= 0"
      - name: duration_seconds
        data_tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: "> 0"
