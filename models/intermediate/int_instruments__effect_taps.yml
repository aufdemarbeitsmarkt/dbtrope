models:
  - name: int_instruments__effect_taps
    description: >
      Each copy of an instrument's sound that reaches the mix, one row per
      piece_id, instrument_name, effect_name and tap_index: the dry sound,
      each echo of its delay and each reflection of its reverb, with how
      late it arrives and its gain in each channel. Every instrument has
      its dry tap.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [piece_id, instrument_name, effect_name, tap_index]
    columns:
      - name: piece_id
        data_tests: [not_null]
      - name: instrument_name
        data_tests: [not_null]
      - name: effect_name
        description: dry, delay or reverb.
        data_tests:
          - accepted_values:
              arguments:
                values: [delay, dry, reverb]
      - name: tap_index
        description: The tap's position within its effect, from 1; 0 for the dry sound.
        data_tests: [not_null]
      - name: delay_seconds
        description: How long after the dry sound the tap arrives.
        data_tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: ">= 0"
      - name: left_gain
        data_tests: [not_null]
      - name: right_gain
        data_tests: [not_null]

unit_tests:
  - name: delays_echo_at_falling_levels
    model: int_instruments__effect_taps
    given:
      - input: ref('piece_instruments')
        rows:
          - {piece_id: p, instrument_name: echoing, delay_seconds: 0.5, delay_feedback: 0.5, delay_repeats: 2, reverb_seconds: null, reverb_mix: 0.25}
          - {piece_id: p, instrument_name: plain, delay_seconds: null, delay_feedback: 0.4, delay_repeats: 3, reverb_seconds: null, reverb_mix: 0.25}
    expect:
      rows:
        - {instrument_name: echoing, effect_name: dry, tap_index: 0, delay_seconds: 0, left_gain: 1, right_gain: 1}
        - {instrument_name: echoing, effect_name: delay, tap_index: 1, delay_seconds: 0.5, left_gain: 0.5, right_gain: 0.5}
        - {instrument_name: echoing, effect_name: delay, tap_index: 2, delay_seconds: 1, left_gain: 0.25, right_gain: 0.25}
        - {instrument_name: plain, effect_name: dry, tap_index: 0, delay_seconds: 0, left_gain: 1, right_gain: 1}
