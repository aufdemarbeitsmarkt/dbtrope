models:
  - name: piece_sections
    description: >
      Each section of each piece, one row per piece_id and section_name,
      with its YAML as JSON. A piece written with voices: and no sections:
      has one section, main, holding those voices.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [piece_id, section_name]
    columns:
      - name: piece_id
        data_tests: [not_null]
      - name: section_name
        data_tests: [not_null]
      - name: section_index
        description: The section's position under sections:, from 1. A piece without a form plays its sections in this order.
        data_tests: [not_null]
      - name: section
        description: The section's YAML as JSON.
        data_tests: [not_null]
