# Every model in core/: the objects render/ and analyses read: sections as the
# form plays them, each piece's ensemble and its instruments' parts, and the score.
# Models are in lineage order.

models:
  - name: sections
    description: >
      Each section as the form plays it, one row per piece_id and
      form_index, with its start and length in beats and seconds. A section
      lasts as long as its longest voice, and starts when the section
      before it ends.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [piece_id, form_index]
    columns:
      - name: piece_id
        data_tests: [not_null]
      - name: form_index
        data_tests: [not_null]
      - name: section_name
        data_tests: [not_null]
      - name: start_beats
        description: Beats from the start of the piece.
        data_tests: [not_null]
      - name: duration_beats
        data_tests: [not_null]
      - name: start_seconds
        data_tests: [not_null]
      - name: duration_seconds
        data_tests: [not_null]
      - name: tempo_bpm
        description: The tempo the section plays at, in quarter-note beats per minute.
        data_tests: [not_null]
      - name: meter
        description: The section's time signature, such as 3/4.
        data_tests: [not_null]
      - name: bar_beats
        description: How many quarter-note beats a bar of the meter lasts; 3 in 6/8.
        data_tests: [not_null]
      - name: is_whole_bars
        description: >
          False when the section ends partway through a bar of the piece's
          meter, which shifts every later section off the bar line. The
          piece still plays, so the test warns rather than fails.
        data_tests:
          - expression_is_true:
              arguments:
                expression: "= true"
              config:
                severity: warn

  - name: ensemble
    description: >
      Each piece's instruments with their envelope, pan and range in MIDI
      notes, one row per piece_id and instrument_name. An instrument
      without a range has null range columns and can play any note.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [piece_id, instrument_name]
      # a range note name that isn't a real note name
      - expression_is_true:
          arguments:
            expression: "(lowest_note_name is null or lowest_midi_note is not null) and (highest_note_name is null or highest_midi_note is not null)"
    columns:
      - name: piece_id
        data_tests: [not_null]
      - name: instrument_name
        data_tests: [not_null]
      - name: attack_seconds
        data_tests: [not_null]
      - name: decay_seconds
        data_tests: [not_null]
      - name: sustain_level
        data_tests: [not_null]
      - name: release_seconds
        data_tests: [not_null]
      - name: pan
        data_tests: [not_null]

  - name: instrument_partials
    description: >
      The harmonics of each piece's instruments, one row per piece_id,
      instrument_name and partial_index, with amplitudes scaled so each
      instrument's partials sum to 1.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [piece_id, instrument_name, partial_index]
    columns:
      - name: piece_id
        data_tests: [not_null]
      - name: instrument_name
        data_tests: [not_null]
      - name: partial_index
        data_tests: [not_null]
      - name: frequency_ratio
        data_tests: [not_null]
      - name: partial_amplitude
        description: Share of the instrument's level, from 0 to 1.
        data_tests: [not_null]

  - name: instrument_effect_taps
    description: >
      Each copy of an instrument's sound that reaches the mix, one row per
      piece_id, instrument_name, effect_name and tap_index: the dry sound,
      each echo of its delay and each reflection of its reverb, with how
      late it arrives and its gain in each channel. Every instrument has
      its dry tap; each effect's taps come from its own model in
      intermediate/effects/ (int_taps__delayed, int_taps__reverberated). Effects here are all
      delayed, scaled copies of the sound; one that reshapes the samples
      themselves, such as a filter or distortion, would be a step in
      render/ instead.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [piece_id, instrument_name, effect_name, tap_index]
    columns:
      - name: piece_id
        data_tests: [not_null]
      - name: instrument_name
        data_tests: [not_null]
      - name: effect_name
        description: dry, or the name of an effect such as delay or reverb.
        data_tests:
          - is_effect_name:
              arguments:
                also: [dry]
      - name: tap_index
        description: The tap's position within its effect, from 1; 0 for the dry sound.
        data_tests: [not_null]
      - name: delay_seconds
        description: How long after the dry sound the tap arrives.
        data_tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: ">= 0"
      - name: left_gain
        data_tests: [not_null]
      - name: right_gain
        data_tests: [not_null]

  - name: score_notes
    description: >
      The score. One row per sounding tone, keyed by piece_id, voice_id,
      event_index and chord_tone_index, with the section it plays in, its
      instrument, pitch, velocity, and start and length in beats and
      seconds. Sections play in the order of the form, and a voice's events
      in a section follow one another without gaps. A voice with the same
      name in several sections is one voice. Beats convert to seconds at
      the piece's tempo. Rests are left out.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [piece_id, voice_id, event_index, chord_tone_index]
    columns:
      - name: piece_id
        data_tests: [not_null]
      - name: voice_id
        data_tests: [not_null]
      - name: event_index
        description: >
          The event's position in its voice across the whole piece, from 1.
          Rests count, so a voice's event_index can skip numbers.
        data_tests: [not_null]
      - name: chord_tone_index
        data_tests: [not_null]
      - name: form_index
        description: The form entry the note plays in.
        data_tests: [not_null]
      - name: section_name
        data_tests: [not_null]
      - name: instrument_name
        data_tests: [not_null]
      - name: midi_note
        description: MIDI note number; 60 is middle C.
        data_tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: "between 0 and 127"
      - name: frequency_hz
        description: Equal-tempered frequency, with A4 (MIDI 69) at 440 Hz.
        data_tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: "> 0"
      - name: velocity
        description: How hard the note is played, from 0 to 127.
        data_tests: [not_null]
      - name: start_beats
        data_tests: [not_null]
      - name: duration_beats
        data_tests: [not_null]
      - name: start_seconds
        data_tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: ">= 0"
      - name: duration_seconds
        data_tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: "> 0"
      - name: is_in_instrument_range
        description: >
          False when the note is outside its instrument's range. The note
          still plays, so the test warns rather than fails.
        data_tests:
          - expression_is_true:
              arguments:
                expression: "= true"
              config:
                severity: warn

unit_tests:
  - name: sections_follow_the_form
    model: sections
    given:
      - input: ref('int_events__sequenced')
        rows:
          # section a's longest voice lasts 4 beats, b's 2
          - {piece_id: p, section_name: a, start_beats: 0, duration_beats: 3}
          - {piece_id: p, section_name: a, start_beats: 3, duration_beats: 1}
          - {piece_id: p, section_name: a, start_beats: 0, duration_beats: 2}
          - {piece_id: p, section_name: b, start_beats: 0, duration_beats: 2}
      - input: ref('piece_form')
        rows:
          - {piece_id: p, form_index: 1, section_name: a}
          - {piece_id: p, form_index: 2, section_name: b}
          - {piece_id: p, form_index: 3, section_name: a}
      - input: ref('pieces')
        rows:
          - {piece_id: p, tempo_bpm: 120, meter: 2/4, beats_per_bar: 2}
    expect:
      rows:
        - {form_index: 1, section_name: a, start_beats: 0, duration_beats: 4, start_seconds: 0, duration_seconds: 2}
        - {form_index: 2, section_name: b, start_beats: 4, duration_beats: 2, start_seconds: 2, duration_seconds: 1}
        - {form_index: 3, section_name: a, start_beats: 6, duration_beats: 4, start_seconds: 3, duration_seconds: 2}

  - name: notes_are_placed_in_their_sections_at_the_piece_tempo
    model: score_notes
    given:
      - input: ref('int_events__sequenced')
        rows:
          - {piece_id: p, section_name: a, voice_id: lead, event_index: 1, velocity: 80, start_beats: 0, duration_beats: 1}
          - {piece_id: p, section_name: a, voice_id: lead, event_index: 2, velocity: 80, start_beats: 1, duration_beats: 3}
          - {piece_id: p, section_name: b, voice_id: lead, event_index: 1, velocity: 80, start_beats: 0, duration_beats: 1}
          - {piece_id: p, section_name: b, voice_id: lead, event_index: 2, velocity: 80, start_beats: 1, duration_beats: 1}
      - input: ref('sections')
        rows:
          - {piece_id: p, form_index: 1, section_name: a, start_beats: 0, tempo_bpm: 120}
          - {piece_id: p, form_index: 2, section_name: b, start_beats: 4, tempo_bpm: 120}
          - {piece_id: p, form_index: 3, section_name: a, start_beats: 6, tempo_bpm: 120}
      - input: ref('int_notes__pitched')
        rows:
          - {piece_id: p, section_name: a, voice_id: lead, event_index: 1, chord_tone_index: 1, is_rest: false, midi_note: 60, frequency_hz: 261.6}
          - {piece_id: p, section_name: a, voice_id: lead, event_index: 2, chord_tone_index: 1, is_rest: false, midi_note: 64, frequency_hz: 329.6}
          - {piece_id: p, section_name: b, voice_id: lead, event_index: 1, chord_tone_index: 1, is_rest: true, midi_note: null, frequency_hz: null}
          - {piece_id: p, section_name: b, voice_id: lead, event_index: 2, chord_tone_index: 1, is_rest: false, midi_note: 67, frequency_hz: 392.0}
      - input: ref('piece_voices')
        rows:
          - {piece_id: p, section_name: a, voice_id: lead, instrument_name: sine}
          - {piece_id: p, section_name: b, voice_id: lead, instrument_name: sine}
      - input: ref('ensemble')
        rows:
          - {piece_id: p, instrument_name: sine, lowest_midi_note: null, highest_midi_note: null}
    expect:
      rows:
        - {event_index: 1, form_index: 1, midi_note: 60, start_beats: 0, duration_beats: 1, start_seconds: 0, duration_seconds: 0.5}
        - {event_index: 2, form_index: 1, midi_note: 64, start_beats: 1, duration_beats: 3, start_seconds: 0.5, duration_seconds: 1.5}
        - {event_index: 4, form_index: 2, midi_note: 67, start_beats: 5, duration_beats: 1, start_seconds: 2.5, duration_seconds: 0.5}
        - {event_index: 5, form_index: 3, midi_note: 60, start_beats: 6, duration_beats: 1, start_seconds: 3, duration_seconds: 0.5}
        - {event_index: 6, form_index: 3, midi_note: 64, start_beats: 7, duration_beats: 3, start_seconds: 3.5, duration_seconds: 1.5}
