description: >
  A slow piece in A minor. A written theme over a reverberant pad,
  then a melody improvised from the theme's notes with a markov walk,
  the theme upside down, and the theme again at half speed.
tempo: 84
meter: 3/4
key: {root: A, scale: minor}
seed: 7
instruments:
  hall: {use: soft_pad, reverb: {seconds: 2.5, mix: 0.35}, pan: -0.2}
  bell: {use: glass, delay: {seconds: 0.536, feedback: 0.35, repeats: 3}, pan: 0.2}
motifs:
  theme:
    degrees: [5, 4, 3, 2, 3, 1, 2, 0, 1]
    beats: [q, q, q, h, q, q, q, q, dotted_h]
  harmony:
    instrument: hall
    octave: 3
    chords: [i, iv, v7, i]
    beats: [dotted_h]
    velocity: 60
sections:
  opening:
    voices:
      - {name: melody, instrument: bell, motif: theme}
      - {name: pad, motif: harmony}
  wandering:
    voices:
      # a walk over the theme's pitches: each step goes to a note that followed this one in the theme
      - name: melody
        instrument: bell
        motif: theme
        beats: [q, h]
        improv: {method: markov, length: 8}
      - {name: pad, motif: harmony, chords: [i, vi, iv, v]}
  turning:
    voices:
      - {name: melody, instrument: bell, motif: theme, invert: true}
      - {name: pad, motif: harmony, chords: [iv, i, v, i]}
  closing:
    voices:
      - {name: melody, instrument: bell, motif: theme, augment: 2}
      - {name: pad, motif: harmony, augment: 2}
form: [opening, wandering, turning, closing]
