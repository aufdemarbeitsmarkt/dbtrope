seeds:
  - name: pitch_classes
    description: >
      Every spelling of a pitch class, one row per pitch_name (C, C#, Db, …).
      semitones_from_c is the distance above C in the same octave number, so
      Cb is -1 (Cb4 is B3) and B# is 12 (B#3 is C4).
    config:
      column_types:
        pitch_name: varchar
        semitones_from_c: integer
    columns:
      - name: pitch_name
        data_tests: [unique, not_null]

  - name: duration_aliases
    description: >
      Names a piece can use in place of a number of beats, one row per
      duration_name: w, h, q, e and s for whole to sixteenth notes, with
      dotted_ and triplet_ forms. A beat is a quarter note.
    config:
      column_types:
        duration_name: varchar
        duration_beats: double
    columns:
      - name: duration_name
        data_tests: [unique, not_null]
