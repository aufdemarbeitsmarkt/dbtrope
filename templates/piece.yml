# Template for a new piece. Create one with:
#
#     make new-piece NAME=my_piece
#
# which writes pieces/my_piece.yml from everything below the header line.
# The file's name is the piece's name. Every key is optional except sections
# (or voices, for a piece with only one section); delete what you don't need.
# The README lists the finished examples in pieces/.
# --- end of template header ---
description: Describe the piece here.
tempo: 120                      # quarter-note beats per minute
meter: 4/4
key: {root: C, scale: major}    # scale: any scale_name in seeds/seed_scales.csv
seed: 0                         # seeds improvised voices; change it for another take

# Effects that several instruments can share, by name. An instrument uses
# one with effects: {reverb: {use: room}}, and can change settings beside use:.
effects:
  room: {reverb: {seconds: 1.8, mix: 0.3}}         # seconds to fade by 60 dB

# Instruments for this piece only. Voices can also name any stored
# instrument in instruments/ without declaring it here.
instruments:
  # a stored instrument with some settings changed
  lead:
    use: pluck
    pan: 0.2
    effects:
      delay: {seconds: 0.375, feedback: 0.35, repeats: 3}  # echoes; seconds between them
  # an instrument defined only for this piece
  organ:
    partials: [[1, 1], [2, 0.5], [3, 0.25], [4, 0.12]]   # [frequency ratio, amplitude]
    adsr: {a: 0.02, d: 0.1, s: 0.8, r: 0.3}              # seconds, seconds, level, seconds
    range: [C2, C6]
    pan: -0.2
    effects:
      reverb: {use: room}                                # the named effect above

# Motifs are phrases that voices can play, by name, in any section.
# A motif holds any keys a voice can have; the voice's own keys win.
motifs:
  hook:
    notes: [C4, D4, E4, G4, E4, D4, C4, r]
    beats: [e, e, e, e, q, q, h, h]     # numbers, or names from seeds/seed_duration_aliases.csv
    velocities: [100, 80]               # 0 to 127; repeats like beats

# Sections play one after another; a section lasts as long as its
# longest voice. Voices with the same name in different sections are
# one voice in the score.
sections:
  verse:
    voices:
      # note names: C4 is middle C; # and b for sharps and flats; r is a rest
      - name: melody
        instrument: lead
        motif: hook
        repeat: 2                       # play it twice in a row

      # chords: Roman numerals stacked in thirds within the key; add 7 for a seventh
      - name: chords
        instrument: organ
        velocity: 70
        octave: 3
        chords: [I, vi, IV, V7]
        beats: [w]

      # scale degrees: 1 is the key's root in this octave; 8 is an octave up
      - name: bass
        instrument: warm_bass
        octave: 2
        degrees: [1, 6, 4, 5]
        beats: [w]
        transpose: 0                    # semitones added to every pitch

  bridge:
    voices:
      # the hook transformed: each of these is optional
      - name: melody
        instrument: lead
        motif: hook
        retrograde: true                # play it backwards, rhythm included
        invert: true                    # mirror it around its first pitch
        augment: 0.5                    # halve every length; 2 doubles them
        repeat: 2
        transpose: 7

      - name: chords
        instrument: organ
        velocity: 70
        octave: 3
        chords: [IV, V]
        beats: [w]

      # improvised: markov walks between pitches that follow each other
      # in the written line; permutation shuffles them. Both keep the
      # written rhythm, and the same seed always gives the same notes.
      - name: bass
        instrument: warm_bass
        octave: 2
        degrees: [1, 5, 4, 5, 1, 4, 1]
        beats: [h, q, q]
        improv: {method: markov, length: 8}

# The order sections play in; a section can come back. Leave it out
# to play each section once, in the order written.
form: [verse, bridge, verse]
