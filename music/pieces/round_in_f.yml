description: >
  A three-voice round in F major. Four two-bar phrases fit over the
  same I–V harmony, so each voice can enter two bars after the one
  before. Written as sections of motifs: each section is two bars, and
  each voice plays the phrase after the one it played in the section
  before.
tempo: 132
meter: 4/4
key: {root: F, scale: major}
# one echo, a dotted quarter at 132 bpm, shared by both sides
effects:
  echo: {delay: {seconds: 0.455, feedback: 0.3, repeats: 2}}
instruments:
  left: {use: pluck, pan: -0.6, effects: {delay: {use: echo}}}
  right: {use: pluck, pan: 0.6, effects: {delay: {use: echo}}}
motifs:
  # bar one sits on I (F A C), bar two on V (C E G)
  a: {degrees: [1, 3, 5, 3, 2, 5, 7, 5], beats: [q]}
  b: {degrees: [5, 6, 5, 3, 4, 2, 0, 2], beats: [e, e, q, q, q, q, q, h]}
  c: {degrees: [8, 8, 5, 5, 7, 7, 5, r], beats: [dotted_q, e, q, q, dotted_q, e, q, q]}
  d: {degrees: [3, 2, 1, -2, 0, 2, 1], beats: [q, q, q, q, q, q, h]}
  drone: {instrument: warm_bass, octave: 2, degrees: [1, 5], beats: [w], velocity: 80}
sections:
  one:
    voices:
      - {name: first, instrument: left, octave: 5, motif: a}
      - {name: bass, motif: drone}
  two:
    voices:
      - {name: first, instrument: left, octave: 5, motif: b}
      - {name: second, instrument: glass, octave: 5, motif: a}
      - {name: bass, motif: drone}
  three:
    voices:
      - {name: first, instrument: left, octave: 5, motif: c}
      - {name: second, instrument: glass, octave: 5, motif: b}
      - {name: third, instrument: right, octave: 4, motif: a}
      - {name: bass, motif: drone}
  four:
    voices:
      - {name: first, instrument: left, octave: 5, motif: d}
      - {name: second, instrument: glass, octave: 5, motif: c}
      - {name: third, instrument: right, octave: 4, motif: b}
      - {name: bass, motif: drone}
  five:
    voices:
      - {name: second, instrument: glass, octave: 5, motif: d}
      - {name: third, instrument: right, octave: 4, motif: c}
      - {name: bass, motif: drone}
  six:
    voices:
      - {name: third, instrument: right, octave: 4, motif: d}
      - {name: bass, motif: drone}
  # all three voices end together on the tonic
  ending:
    voices:
      - {name: first, instrument: left, octave: 5, degrees: [1], beats: [w]}
      - {name: second, instrument: glass, octave: 5, degrees: [3], beats: [w]}
      - {name: third, instrument: right, octave: 4, degrees: [5], beats: [w]}
      - {name: bass, instrument: warm_bass, octave: 2, degrees: [1], beats: [w], velocity: 80}
form: [one, two, three, four, one, two, three, four, five, six, ending]
