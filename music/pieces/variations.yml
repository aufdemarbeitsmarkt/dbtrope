description: >
  A three-bar theme in G major and four variations on it, each one a
  transform of the same motif: played backwards, upside down, twice as
  fast and twice as slow.
tempo: 108
meter: 4/4
key: {root: G, scale: major}
motifs:
  theme:
    degrees: [1, 3, 5, 8, 7, 5, 6, 4, 5, 3, 2, 1]
    beats: [q, q, q, q, dotted_q, e, q, q, q, q, q, q]
  bass:
    instrument: warm_bass
    octave: 2
    degrees: [1, 4, 5]
    beats: [w]
    velocity: 85
instruments:
  keys: {use: pluck, adsr: {d: 0.6, s: 0.1}, effects: {reverb: {seconds: 0.8, mix: 0.15}}}
sections:
  theme:
    voices:
      - {name: melody, instrument: keys, motif: theme}
      - {name: bass, motif: bass}
  backwards:
    voices:
      - {name: melody, instrument: keys, motif: theme, retrograde: true}
      # backwards, the bass line becomes a cadence: V, IV, I
      - {name: bass, motif: bass, retrograde: true}
  upside_down:
    voices:
      # mirrored around the first degree, so it falls where the theme rose; an octave up to stay clear of the bass
      - {name: melody, instrument: keys, motif: theme, invert: true, octave: 5}
      - {name: bass, motif: bass}
  double_time:
    voices:
      - {name: melody, instrument: keys, motif: theme, augment: 0.5, repeat: 2, velocities: [110, 70, 90, 70]}
      - {name: bass, motif: bass}
  broad:
    voices:
      - {name: melody, instrument: glass, motif: theme, augment: 2}
      - {name: bass, motif: bass, augment: 2}
form: [theme, backwards, upside_down, double_time, broad]
