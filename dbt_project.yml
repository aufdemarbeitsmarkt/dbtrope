name: dbtrope
version: "0.1.0"
config-version: 2
profile: dbtrope

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

vars:
  # 22050 for drafts, 44100 for final renders
  sample_rate: 22050
  output_dir: output
  # where piece and stored instrument files are read from
  pieces_dir: music/pieces
  instruments_dir: music/instruments
  # what to render: a piece name, a path to a .yml file, or all. dbt build and
  # dbt run stop unless it's given: --vars '{piece: nocturne}' (see macros/require_piece.sql)
  piece: null

on-run-start:
  - "{{ require_piece() }}"

models:
  dbtrope:
    base:
      +materialized: view
    intermediate:
      +materialized: view
    render:
      +materialized: table
