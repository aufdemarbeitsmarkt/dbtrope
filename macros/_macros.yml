macros:
  - name: require_piece
    description: >
      Runs at the start of dbt build and dbt run (on-run-start in
      dbt_project.yml). Rendering is the slow part of a build, so the piece
      var must say what to render: a piece name, a path to a .yml file, or
      `all`. Without it the run stops before anything is built, rather than
      rendering every piece in music/pieces/ by accident. parse, compile, ls, show
      and docs don't render, so they don't need it.

  - name: effect_models
    description: >
      Every effect, as a map from its name to the graph node of the model
      that builds its taps. Each effect model in intermediate/effects/
      declares its name with config(meta={'effect_name': ...}), beside the
      logic that reads its settings, so adding an effect needs no list of
      names to keep up. base/effect_registry and instrument_effect_taps read
      it. Empty while dbt parses, since the graph is only filled in when dbt
      executes.
